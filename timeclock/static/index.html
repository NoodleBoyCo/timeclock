<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Time Clock">
<title>Time Clock</title>
<style>
  :root {
    --bg: #101418; --panel: #1b2128; --key: #252d36; --key-down: #34404c;
    --text: #eef2f5; --muted: #8a97a4; --accent: #3fa7ff;
    --ok: #22a06b; --err: #d64545;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: manipulation; overflow: hidden; }
  main { height: 100%; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 3vh; padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom); }
  header { text-align: center; }
  #biz { font-size: 2.2vh; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
  #clock { font-size: 8vh; font-weight: 300; font-variant-numeric: tabular-nums; line-height: 1.1; }
  #date { font-size: 2.4vh; color: var(--muted); }
  #prompt { font-size: 2.6vh; color: var(--muted); height: 3.2vh; }
  #dots { display: flex; gap: 2.4vh; }
  .dot { width: 2.6vh; height: 2.6vh; border-radius: 50%; border: 2px solid var(--muted); transition: background .1s; }
  .dot.on { background: var(--text); border-color: var(--text); }
  #dots.shake { animation: shake .35s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-12px)} 75%{transform:translateX(12px)} }
  #pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.6vh; width: min(90vw, 52vh); }
  button { font: inherit; color: var(--text); background: var(--key); border: 0; border-radius: 18px;
    font-size: 4.4vh; aspect-ratio: 1.35; cursor: pointer; }
  button:active, button.down { background: var(--key-down); }
  button.fn { font-size: 2.4vh; color: var(--muted); background: var(--panel); }
  #overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 2vh; padding: 24px; text-align: center; }
  #overlay.show { display: flex; }
  #overlay.ok { background: var(--ok); }
  #overlay.err { background: var(--err); }
  #ov-title { font-size: 7vh; font-weight: 600; }
  #ov-msg { font-size: 3.2vh; max-width: 30ch; }
  #logo { max-height: 8vh; max-width: 40vw; object-fit: contain; pointer-events: none; }
</style>
</head>
<body>
<main>
  <header>
    <div id="biz"></div>
    <div id="clock">--:--</div>
    <div id="date"></div>
  </header>
  <div id="prompt">Enter your PIN</div>
  <div id="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  <div id="pad">
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button class="fn" data-k="clear">Clear</button><button data-k="0">0</button><button class="fn" data-k="back">⌫</button>
  </div>
  <img id="logo" src="/static/logo.png" alt="" onerror="this.remove()">
</main>

<div id="overlay"><div id="ov-title"></div><div id="ov-msg"></div></div>

<script>
  let pin = "";
  let busy = false;
  let overlayTimer = null;
  const dots = [...document.querySelectorAll(".dot")];

  function render() { dots.forEach((d, i) => d.classList.toggle("on", i < pin.length)); }

  function tickClock() {
    const now = new Date();
    document.getElementById("clock").textContent =
      now.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    document.getElementById("date").textContent =
      now.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" });
  }
  setInterval(tickClock, 1000); tickClock();

  fetch("/api/info").then(r => r.json())
    .then(d => document.getElementById("biz").textContent = d.business_name).catch(() => {});

  function showOverlay(ok, title, msg) {
    const ov = document.getElementById("overlay");
    ov.className = "show " + (ok ? "ok" : "err");
    document.getElementById("ov-title").textContent = title;
    document.getElementById("ov-msg").textContent = msg;
    clearTimeout(overlayTimer);
    overlayTimer = setTimeout(hideOverlay, ok ? 3000 : 3500);
  }
  function hideOverlay() { document.getElementById("overlay").className = ""; }
  document.getElementById("overlay").addEventListener("click", hideOverlay);

  async function submit() {
    busy = true;
    const entered = pin;
    try {
      const res = await fetch("/api/punch", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ pin: entered })
      });
      const d = await res.json();
      if (d.ok) {
        showOverlay(true, d.action === "in" ? "Clocked In" : "Clocked Out", d.message);
      } else {
        const el = document.getElementById("dots");
        el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake");
        showOverlay(false, "Try again", d.message || "Something went wrong.");
      }
    } catch (e) {
      showOverlay(false, "No connection", "Can't reach the time clock. Please tell a manager.");
    } finally {
      pin = ""; render(); busy = false;
    }
  }

  function press(k) {
    if (busy) return;
    if (k === "clear") pin = "";
    else if (k === "back") pin = pin.slice(0, -1);
    else if (pin.length < 4) pin += k;
    render();
    if (pin.length === 4) submit();
  }

  document.getElementById("pad").addEventListener("pointerdown", e => {
    const b = e.target.closest("button");
    if (!b) return;
    e.preventDefault();
    press(b.dataset.k);
  });

  // Keyboard support for testing on a computer.
  document.addEventListener("keydown", e => {
    if (/^[0-9]$/.test(e.key)) press(e.key);
    else if (e.key === "Backspace") press("back");
    else if (e.key === "Escape") press("clear");
  });

  // Reload every night at 4am so updates and any stuck state clear themselves.
  setInterval(() => { const n = new Date(); if (n.getHours() === 4 && n.getMinutes() === 0) location.reload(); }, 60000);
</script>
</body>
</html>
